# ANFILT Research Agent — Streamlit 테마 (홈페이지 'Iron & Ink'와 통일)
[theme]
base = "light"
primaryColor = "#8C2F16"          # 산화철 액센트
backgroundColor = "#ECE8E1"       # paper
secondaryBackgroundColor = "#E4DFD6"
textColor = "#1B1813"             # ink
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# 자동 내비를 끄고 `ui_common.nav()` 가 목록을 그린다 — 체험판에 설치판 전용
# 화면(⚙️ 설정)이 보이지 않게 하려면 목록을 우리가 정해야 한다.
showSidebarNavigation = false
